name: Publish queued blog posts

# The last step of the twice-weekly blog.
#
# The CRM writes the next post from its queue at 09:00 on Tuesdays and
# Fridays. This runs an hour later, pulls anything it has written, and
# commits the pages. The push then triggers the sitemap workflow, so a new
# post is indexed without anybody touching anything.
#
# An hour's gap rather than minutes, because the writing is a model call that
# can be slow or can fail and be retried; if it has not finished, this run
# finds nothing, says so, and the next one picks it up.
#
# It never overwrites a post already on disk, so a page edited by hand here
# is safe from a job that runs unattended.

on:
  schedule:
    - cron: "0 10 * * 2,5"      # Tuesday and Friday, 10:00 UTC
  workflow_dispatch:            # and whenever Robin wants one now

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write           # to push the new pages back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull anything the CRM has written
        run: python3 _build/pull_posts.py

      - name: Commit the new pages
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing new to publish."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog
          NEW=$(git diff --cached --name-only --diff-filter=A -- 'blog/*/index.html' | wc -l | tr -d ' ')
          git commit -m "Publish ${NEW} blog post(s) from the queue"
          git push
